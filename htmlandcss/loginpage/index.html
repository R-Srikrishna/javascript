<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Login-form</title>
    <body>
      <h1>Login</h1>
      <p>Welcome form</p>
      <form>
        <div>
          <label>Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          /><br />
          <label>password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit">Login</button>
      </form>
      <p>
        <a href="#">Forget password</a>
      </p>
      <p>Do you have an account?</p>
      <a href="#">Register</a>
    </body>
  </head>
</html>
